[project]
name = "lens-core"
version = "0.1.0"
description = "Lens core: normalised trace model, trajectory reconstruction, metric registry, judges"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "typer>=0.12",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
judges = ["litellm>=1.50"]
detector = ["onnxruntime>=1.18", "tokenizers>=0.19", "numpy>=1.26"]

[project.scripts]
lens = "lens_core.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lens_core"]
