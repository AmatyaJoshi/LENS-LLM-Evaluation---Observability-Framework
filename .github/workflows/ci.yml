name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q

  web:
    name: web (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  compose:
    name: docker compose up --wait
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose config -q
      - run: docker compose up -d --build --wait --wait-timeout 300
      - name: smoke test ingest + trajectory
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8000/health
          curl -fsS -X POST http://localhost:4318/v1/traces \
            -H 'content-type: application/json' \
            --data @tests/fixtures/otlp/openllmetry_python.json
          sleep 3
          curl -fsS http://localhost:8000/traces/0af7651916cd43dd8448eb211c80319c/trajectory | head -c 400
          curl -fsS http://localhost:3000/ >/dev/null
      - if: always()
        run: docker compose ps -a
      - if: always()
        run: docker compose logs --no-color --tail=150
      - if: always()
        run: docker compose down -v
