name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      - name: training + corpus smoke test
        run: |
          uv run python data/probes/build_probes.py
          uv run python data/gold/build_rag_demo_gold.py
          uv run python -m training.injection.build_dataset --offline

  eval-gate:
    name: eval gate (dogfood lens-ci-action)
    runs-on: ubuntu-latest
    needs: [python]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: prepare a scored dataset (recorded app outputs)
        run: |
          cat > ci-dataset.jsonl <<'JSONL'
          {"id": "1", "input": "What is the refund window for Acme Pro?", "output": "Acme Pro can be refunded within 30 days.", "expected_output": "30 days", "contexts": ["Acme Pro purchases can be refunded within 30 days of purchase."]}
          {"id": "2", "input": "Which port is OTLP/HTTP on?", "output": "Port 4318.", "expected_output": "4318", "contexts": ["The collector listens on 4317 for gRPC and 4318 for HTTP."]}
          JSONL
      - name: baseline run (offline, cassette judge)
        env:
          LENS_JUDGE_CASSETTE: tests/fixtures/judge_cassette.json
        run: uv run lens eval --dataset ci-dataset.jsonl --app rag_demo --metrics faithfulness --local --out baseline.json --sha baseline
      - name: run the evaluation gate
        env:
          LENS_JUDGE_CASSETTE: tests/fixtures/judge_cassette.json
        run: |
          uv run lens ci --dataset ci-dataset.jsonl --app rag_demo \
            --metrics faithfulness --baseline-file baseline.json \
            --threshold faithfulness:-0.03 --summary-file "$GITHUB_STEP_SUMMARY" --sha "${GITHUB_SHA}"

  web:
    name: web (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  compose:
    name: docker compose up --wait
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose config -q
      - run: docker compose up -d --build --wait --wait-timeout 300
      - name: smoke test ingest + trajectory
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8000/health
          curl -fsS -X POST http://localhost:4318/v1/traces \
            -H 'content-type: application/json' \
            --data @tests/fixtures/otlp/openllmetry_python.json
          sleep 3
          curl -fsS http://localhost:8000/traces/0af7651916cd43dd8448eb211c80319c/trajectory | head -c 400
          curl -fsS http://localhost:3000/ >/dev/null
      - if: always()
        run: docker compose ps -a
      - if: always()
        run: docker compose logs --no-color --tail=80 web api
      - if: always()
        run: docker compose logs --no-color --tail=150
      - if: always()
        run: docker compose down -v
