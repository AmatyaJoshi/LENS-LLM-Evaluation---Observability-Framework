[project]
name = "lens-monorepo"
version = "0.0.0"
description = "Lens — LLM evaluation & observability framework (workspace root)"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/lens-core", "apps/api", "apps/worker", "packages/lens-sdk-python"]

[tool.uv.sources]
lens-core = { workspace = true }
lens-api = { workspace = true }
lens-worker = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
  "lens-core",
  "lens-api",
  "lens-worker",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/api/migrations/alembic/versions", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"packages/lens-core/tests/**" = ["E501"]
"packages/lens-core/lens_core/redteam/detector.py" = ["E501"]
"packages/lens-core/lens_core/cli.py" = ["E501"]
"apps/api/lens_api/services/assistant.py" = ["E501"]
"apps/worker/lens_worker/tasks.py" = ["E501"]
"data/probes/build_probes.py" = ["E501", "F541"]
"packages/lens-core/lens_core/redteam/cli_runner.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["lens_core", "lens_api", "lens_worker", "lens_sdk", "tests"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["lens_core"]
mypy_path = "packages/lens-core"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "onnxruntime", "tokenizers", "litellm", "litellm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "packages/lens-core/tests"]
asyncio_mode = "auto"
