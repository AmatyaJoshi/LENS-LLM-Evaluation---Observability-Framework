[project]
name = "lens-worker"
version = "0.1.0"
description = "Lens Celery worker: evaluate_trace, run_dataset_eval, run_redteam"
requires-python = ">=3.12"
dependencies = [
  "lens-core",
  "lens-api",
  "celery[redis]>=5.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lens_worker"]

[tool.uv.sources]
lens-core = { workspace = true }
lens-api = { workspace = true }
