[project]
name = "lens-api"
version = "0.1.0"
description = "Lens API: OTLP ingest, normalisation, trace/eval REST + WebSocket"
requires-python = ">=3.12"
dependencies = [
  "lens-core",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "opentelemetry-proto>=1.27",
  "protobuf>=4.25",
  "clickhouse-connect>=0.8",
  "sqlmodel>=0.0.22",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "redis>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lens_api"]

[tool.uv.sources]
lens-core = { workspace = true }
